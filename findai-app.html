<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FindAI">
<link rel="manifest" href="/app.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>FindAI</title>
<style>
  :root{
    --bg:#fff; --ink:#0a0a0a; --sub:#8a8f98; --line:#ededf0;
    --card:#111317; --accent:#1a73ff; --good:#12b76a; --chip:#f2f3f5; --chip-ink:#333;
    --nav-h:58px; --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;}
  .app{max-width:520px;margin:0 auto;min-height:100%;position:relative;}
  .screen{display:none;padding-bottom:calc(var(--nav-h) + var(--safe-bot) + 8px);}
  .screen.active{display:block;}
  .topbar{padding:calc(var(--safe-top) + 10px) 16px 6px;display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px;letter-spacing:-.02em;}
  .brand .ai{color:var(--accent);} .brand svg{width:28px;height:28px;}
  .bell{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--chip);border:0;}
  .searchwrap{padding:2px 16px 8px;}
  .searchbar{display:flex;align-items:center;gap:10px;background:var(--chip);border-radius:16px;padding:13px 14px;}
  .searchbar input{border:0;background:transparent;flex:1;font-size:16px;outline:none;color:var(--ink);min-width:0;}
  .searchbar .ico{width:22px;height:22px;color:var(--sub);}
  .searchbar .ic-btn{color:var(--sub);display:grid;place-items:center;background:none;border:0;}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{white-space:nowrap;padding:9px 16px;border-radius:999px;background:var(--chip);color:var(--chip-ink);font-size:14px;font-weight:600;border:0;}
  .chip.active{background:var(--ink);color:#fff;}
  .feed{padding:0 16px;display:flex;flex-direction:column;gap:16px;}
  .pcard{background:var(--card);color:#fff;border-radius:22px;overflow:hidden;}
  .pcard .media{position:relative;background:#0c0e12;aspect-ratio:1/1;display:grid;place-items:center;}
  .pcard .media img{width:100%;height:100%;object-fit:contain;padding:14px;}
  .pcard .trust{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:6px;background:rgba(10,12,16,.72);backdrop-filter:blur(6px);padding:6px 10px;border-radius:12px;font-size:11px;line-height:1;}
  .pcard .trust b{font-size:14px;display:block;margin-bottom:2px;} .pcard .trust .shield{color:var(--good);width:14px;height:14px;}
  .pcard .fav{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:rgba(10,12,16,.55);display:grid;place-items:center;color:#fff;border:0;}
  .pcard .body{padding:16px;}
  .pcard h3{margin:0 0 3px;font-size:18px;font-weight:700;letter-spacing:-.01em;}
  .pcard .sub{color:#aeb4bd;font-size:13px;margin-bottom:12px;}
  .pcard .best-label{color:#aeb4bd;font-size:12px;margin-bottom:2px;}
  .pcard .best{font-size:25px;font-weight:800;letter-spacing:-.02em;margin-bottom:12px;}
  .cta{width:100%;border:0;background:var(--accent);color:#fff;font-weight:700;font-size:16px;padding:14px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;}
  .skel{background:linear-gradient(90deg,#f0f1f3 25%,#e6e8eb 37%,#f0f1f3 63%);background-size:400% 100%;animation:sh 1.2s ease infinite;border-radius:22px;height:320px;}
  @keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
  .empty{padding:50px 24px;text-align:center;color:var(--sub);}
  .empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px;}
  .result{display:none;padding:0 16px calc(var(--nav-h) + var(--safe-bot) + 16px);}
  .result.show{display:block;}
  .result-top{display:flex;align-items:center;gap:12px;padding:calc(var(--safe-top) + 10px) 0 8px;}
  .back{width:38px;height:38px;border-radius:50%;background:var(--chip);border:0;display:grid;place-items:center;flex:0 0 auto;}
  .result-top h2{font-size:17px;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hero-media{background:#f6f7f9;border-radius:20px;aspect-ratio:1/1;display:grid;place-items:center;margin-bottom:14px;overflow:hidden;}
  .hero-media img{width:100%;height:100%;object-fit:contain;padding:18px;}
  .price-block{text-align:center;margin-bottom:16px;}
  .price-block .lab{color:var(--sub);font-size:13px;margin-bottom:2px;}
  .price-block .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1;}
  .price-block .src{color:var(--sub);font-size:13px;margin-top:6px;}
  .buy-primary{width:100%;border:0;background:var(--accent);color:#fff;font-weight:700;font-size:17px;padding:16px;border-radius:15px;display:flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;margin-bottom:10px;}
  .track-secondary{width:100%;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-weight:700;font-size:15px;padding:14px;border-radius:15px;display:flex;align-items:center;justify-content:center;gap:9px;}
  .listings-h{font-size:13px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;margin:22px 0 6px;}
  .lrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;}
  .lrow img{width:52px;height:52px;object-fit:contain;border-radius:11px;background:#f6f7f9;flex:0 0 auto;}
  .lrow .li{flex:1;min-width:0;}
  .lrow .li h4{margin:0 0 2px;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lrow .li .m{color:var(--sub);font-size:12px;} .lrow .rp{font-size:16px;font-weight:800;flex:0 0 auto;}
  #scan .scan-head{text-align:center;padding:calc(var(--safe-top) + 16px) 24px 2px;}
  #scan .scan-head h2{margin:0 0 4px;font-size:22px;font-weight:800;}
  #scan .scan-head p{margin:0;color:var(--sub);font-size:14px;line-height:1.4;}
  .viewport{margin:14px 16px;border-radius:26px;overflow:hidden;background:#0b0d10;position:relative;aspect-ratio:3/4;display:grid;place-items:center;}
  .viewport video,.viewport img.preview{width:100%;height:100%;object-fit:cover;}
  .viewport .ph{color:#4a5058;font-size:14px;text-align:center;padding:24px;}
  .brackets{position:absolute;inset:14%;pointer-events:none;transition:inset .25s ease,opacity .25s ease;}
  .brackets span{position:absolute;width:38px;height:38px;border:3px solid rgba(255,255,255,.92);transition:border-color .2s ease;}
  .brackets .tl{top:0;left:0;border-right:0;border-bottom:0;border-radius:10px 0 0 0;}
  .brackets .tr{top:0;right:0;border-left:0;border-bottom:0;border-radius:0 10px 0 0;}
  .brackets .bl{bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 10px;}
  .brackets .br{bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 10px 0;}
  .viewport.locking .brackets{inset:20%;}
  .viewport.locking .brackets span{border-color:var(--accent);}
  .scan-status{text-align:center;color:var(--sub);font-size:14px;padding:6px 24px 2px;min-height:20px;font-weight:600;}
  .scan-actions{display:flex;gap:10px;padding:8px 16px 0;}
  .scan-actions button{flex:1;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-weight:700;font-size:14px;padding:13px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;}
  #tracker .tk-head{text-align:center;padding:calc(var(--safe-top) + 16px) 24px 6px;}
  #tracker .tk-head h2{margin:0 0 4px;font-size:22px;font-weight:800;}
  #tracker .tk-head p{margin:0;color:var(--sub);font-size:14px;}
  .tk-search{padding:12px 16px;} .tk-list{padding:4px 16px;}
  .tk-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);}
  .tk-row img{width:54px;height:54px;object-fit:contain;border-radius:12px;background:#f6f7f9;flex:0 0 auto;}
  .tk-row .info{flex:1;min-width:0;} .tk-row .info h4{margin:0 0 2px;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tk-row .info .meta{color:var(--sub);font-size:13px;}
  .nav{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;height:calc(var(--nav-h) + var(--safe-bot));padding-bottom:var(--safe-bot);background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;z-index:30;}
  .nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--sub);font-size:10px;font-weight:600;}
  .nav button.active{color:var(--accent);} .nav button svg{width:22px;height:22px;}
  .toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:40;opacity:0;transition:opacity .2s;max-width:88%;text-align:center;pointer-events:none;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="app">
  <section id="search" class="screen active">
    <div id="searchHome">
      <div class="topbar">
        <div class="brand">
          <svg viewBox="0 0 48 48"><defs><linearGradient id="ap" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1748c9"/></linearGradient></defs><circle cx="24" cy="24" r="23" fill="url(#ap)"/><g fill="#fff" opacity=".95"><path d="M24 9 L30 20 L24 20 Z"/><path d="M39 24 L28 30 L28 24 Z"/><path d="M24 39 L18 28 L24 28 Z"/><path d="M9 24 L20 18 L20 24 Z"/><path d="M34.6 13.4 L30 24 L26.5 20.5 Z"/><path d="M34.6 34.6 L24 30 L27.5 26.5 Z"/><path d="M13.4 34.6 L18 24 L21.5 27.5 Z"/><path d="M13.4 13.4 L24 18 L20.5 21.5 Z"/></g><circle cx="24" cy="24" r="5" fill="#fff"/></svg>
          <span>Find<span class="ai">AI</span></span>
        </div>
        <button class="bell" aria-label="Notifications"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>
      </div>
      <div class="searchwrap">
        <form class="searchbar" onsubmit="return doSearch(event)">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="q" type="search" placeholder="Ask FindAI anything…" enterkeyhint="search" autocomplete="off">
          <button type="button" class="ic-btn" aria-label="Scan" onclick="go('scan')"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
        </form>
      </div>
      <div class="chips" id="chips">
        <button class="chip active" data-f="foryou">For You</button>
        <button class="chip" data-f="trending">Trending</button>
        <button class="chip" data-f="deals">Deals</button>
        <button class="chip" data-f="drops">Price Drops</button>
      </div>
      <div class="feed" id="feed"><div class="skel"></div><div class="skel"></div></div>
    </div>
    <div id="searchResult" class="result"></div>
  </section>
  <section id="scan" class="screen">
    <div class="scan-head"><h2>Scan item</h2><p>Point at a LEGO set, sneaker, or product — it detects automatically.</p></div>
    <div class="viewport" id="viewport">
      <div class="ph" id="camPlaceholder">Starting camera…</div>
      <video id="cam" playsinline autoplay muted style="display:none"></video>
      <img id="preview" class="preview" style="display:none" alt="">
      <div class="brackets"><span class="tl"></span><span class="tr"></span><span class="bl"></span><span class="br"></span></div>
    </div>
    <div class="scan-status" id="scanStatus">Hold steady on an item…</div>
    <div class="scan-actions">
      <button onclick="triggerUpload()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>Upload photo</button>
      <button onclick="scanBarcode()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5v14M7 5v14M11 5v14M15 5v14M19 5v14"/></svg>Barcode</button>
    </div>
    <input id="fileInput" type="file" accept="image/*" capture="environment" style="display:none" onchange="onFilePicked(event)">
  </section>
  <section id="tracker" class="screen">
    <div class="tk-head"><h2>Price Tracker</h2><p>Track items and get alerts when prices drop.</p></div>
    <div class="tk-search">
      <form class="searchbar" onsubmit="return trackNew(event)">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="tq" type="search" placeholder="Search an item to track…" enterkeyhint="search">
      </form>
    </div>
    <div class="tk-list" id="tkList"><div class="empty"><b>Nothing tracked yet</b>Search an item above to track its price and get drop alerts.</div></div>
  </section>
  <nav class="nav">
    <button class="active" data-tab="search" onclick="go('search')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>Search</button>
    <button data-tab="scan" onclick="go('scan')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3.5"/></svg>Scan</button>
    <button data-tab="tracker" onclick="go('tracker')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg>Tracker</button>
  </nav>
  <div class="toast" id="toast"></div>
</div>
<script>
const WORKER='https://api.carsearchapi.workers.dev';
function go(tab){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===tab));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  if(tab!=='scan')stopScan();else startScan();
  window.scrollTo(0,0);
}
let toastT;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400);}
function money(v){if(v==null||v==='')return '';const n=Number(v);return isFinite(n)?'A$'+n.toLocaleString(undefined,{maximumFractionDigits:2}):String(v);}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function lastSearch(){try{return localStorage.getItem('fa_last')||'';}catch(_){return '';}}
function setLastSearch(q){try{localStorage.setItem('fa_last',q);}catch(_){}}
async function loadFeed(){
  const feed=document.getElementById('feed');
  const q=lastSearch()||'lego harry potter';
  try{
    const r=await fetch(WORKER+'/tracker/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q})});
    const d=await r.json();
    const items=(d&&d.listings)?d.listings.filter(x=>x&&x.price>0).slice(0,10):[];
    if(!items.length){feed.innerHTML='<div class="empty"><b>Nothing to show yet</b>Try a search to see prices.</div>';return;}
    feed.innerHTML=items.map(it=>{
      const trust=it.trustScore||it._legoScore||null;
      return '<article class="pcard" onclick="quickView(\''+esc(it.title).replace(/'/g,"&#39;")+'\')">'+
        '<div class="media">'+
        (trust?'<div class="trust"><svg class="shield" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l8 3v6c0 5-3.4 8.5-8 11-4.6-2.5-8-6-8-11V5z"/></svg><span><b>'+trust+'</b>Trust Score</span></div>':'')+
        '<button class="fav" onclick="event.stopPropagation();toast(\'Saved\')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 1 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/></svg></button>'+
        (it.image?'<img src="'+esc(it.image)+'" alt="" loading="lazy">':'<div class="ph" style="color:#3a3f47">No image</div>')+
        '</div><div class="body">'+
        '<h3>'+esc((it.title||'').slice(0,56))+'</h3>'+
        '<div class="sub">'+esc(it.source||'ebay')+'</div>'+
        '<div class="best-label">Best price</div>'+
        '<div class="best">'+money(it.price)+'</div>'+
        '<button class="cta" onclick="event.stopPropagation();quickView(\''+esc(it.title).replace(/'/g,"&#39;")+'\')">See price <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg></button>'+
        '</div></article>';
    }).join('');
  }catch(e){feed.innerHTML='<div class="empty"><b>Couldn\'t load</b>Check your connection.</div>';}
}
function doSearch(e){e.preventDefault();const q=document.getElementById('q').value.trim();if(!q)return false;setLastSearch(q);quickView(q);return false;}
const backBtn='<button class="back" onclick="closeResult()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>';
async function quickView(q){
  setLastSearch(q);
  document.getElementById('searchHome').style.display='none';
  const R=document.getElementById('searchResult');
  R.classList.add('show');
  R.innerHTML='<div class="result-top">'+backBtn+'<h2>Finding best price…</h2></div><div class="skel" style="height:260px;margin-bottom:14px"></div>';
  go('search');
  try{
    let query=q;
    try{const rr=await fetch(WORKER+'/resolve-product',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q})});const rj=await rr.json();if(rj&&rj.resolved&&rj.trackerQuery)query=rj.trackerQuery;}catch(_){}
    const r=await fetch(WORKER+'/tracker/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query})});
    const d=await r.json();
    renderQuickView(d,q);
  }catch(e){R.innerHTML='<div class="result-top">'+backBtn+'<h2>Something went wrong</h2></div><div class="empty">Try again in a moment.</div>';}
}
function closeResult(){document.getElementById('searchResult').classList.remove('show');document.getElementById('searchHome').style.display='';}
function renderQuickView(d,displayQ){
  const R=document.getElementById('searchResult');
  const p=d&&d.productDetails;
  let listings=(d&&d.listings)?d.listings.filter(x=>x&&x.price>0):[];
  listings.sort((a,b)=>Number(a.price)-Number(b.price));
  const ebayFirst=listings.filter(x=>/ebay/i.test(x.source||'')).concat(listings.filter(x=>!/ebay/i.test(x.source||'')));
  const top=ebayFirst[0]||listings[0];
  const name=(p&&p.name)||displayQ;
  const heroImg=(p&&p.image)||(top&&top.image)||'';
  if(!top){R.innerHTML='<div class="result-top">'+backBtn+'<h2>'+esc(name)+'</h2></div><div class="empty"><b>No live listings right now</b>We couldn\'t find it on sale this moment.</div>';return;}
  let html='<div class="result-top">'+backBtn+'<h2>'+esc((name||'').slice(0,40))+'</h2></div>'+
    '<div class="hero-media">'+(heroImg?'<img src="'+esc(heroImg)+'" alt="">':'')+'</div>'+
    '<div class="price-block"><div class="lab">Best price now</div><div class="big">'+money(top.price)+'</div><div class="src">on '+esc(top.source||'eBay')+'</div></div>'+
    '<a class="buy-primary" href="'+esc(top.url||'#')+'" target="_blank" rel="noopener">Buy now <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M7 17L17 7M7 7h10v10"/></svg></a>'+
    '<button class="track-secondary" onclick="trackFromResult(\''+esc(displayQ).replace(/'/g,"&#39;")+'\')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>Track price</button>';
  const rest=ebayFirst.slice(1,7);
  if(rest.length){
    html+='<div class="listings-h">Other places to buy</div>';
    html+=rest.map(it=>'<a class="lrow" href="'+esc(it.url||'#')+'" target="_blank" rel="noopener"><img src="'+esc(it.image||'')+'" alt=""><div class="li"><h4>'+esc((it.title||'').slice(0,40))+'</h4><div class="m">'+esc(it.source||'ebay')+'</div></div><div class="rp">'+money(it.price)+'</div></a>').join('');
  }
  R.innerHTML=html;
}
function trackFromResult(q){saveTracked(q);toast('Tracking on — we\'ll alert you on a drop');}
let stream=null,scanTimer=null,lastFrame=null,steadyCount=0,busyVision=false;
async function startScan(){
  const ph=document.getElementById('camPlaceholder'),cam=document.getElementById('cam'),prev=document.getElementById('preview');
  prev.style.display='none';
  document.getElementById('scanStatus').textContent='Hold steady on an item…';
  if(stream)return;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    cam.srcObject=stream;cam.style.display='block';ph.style.display='none';
    steadyCount=0;lastFrame=null;busyVision=false;
    scanTimer=setInterval(monitorSteady,500);
  }catch(e){document.getElementById('scanStatus').textContent='Camera unavailable — use Upload instead.';document.getElementById('camPlaceholder').textContent='Camera unavailable';}
}
function stopScan(){
  if(scanTimer){clearInterval(scanTimer);scanTimer=null;}
  document.getElementById('viewport').classList.remove('locking');
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  const cam=document.getElementById('cam');if(cam)cam.style.display='none';
}
function grabTiny(){
  const cam=document.getElementById('cam');
  if(!cam||!cam.videoWidth)return null;
  const c=document.createElement('canvas');c.width=32;c.height=24;
  c.getContext('2d').drawImage(cam,0,0,32,24);
  return c.getContext('2d').getImageData(0,0,32,24).data;
}
function frameDiff(a,b){if(!a||!b)return 1e9;let s=0;for(let i=0;i<a.length;i+=4){s+=Math.abs(a[i]-b[i]);}return s/(a.length/4);}
async function monitorSteady(){
  if(busyVision||!stream)return;
  const f=grabTiny();if(!f)return;
  const diff=frameDiff(f,lastFrame);lastFrame=f;
  const vp=document.getElementById('viewport');
  if(diff<8){
    steadyCount++;
    if(steadyCount>=2){vp.classList.add('locking');document.getElementById('scanStatus').textContent='Detecting…';}
    if(steadyCount>=3){autoCapture();}
  }else{steadyCount=0;vp.classList.remove('locking');document.getElementById('scanStatus').textContent='Hold steady on an item…';}
}
async function autoCapture(){
  if(busyVision)return;busyVision=true;
  const cam=document.getElementById('cam');
  const c=document.createElement('canvas');c.width=cam.videoWidth||720;c.height=cam.videoHeight||960;
  c.getContext('2d').drawImage(cam,0,0,c.width,c.height);
  const dataUrl=c.toDataURL('image/jpeg',0.85);
  await analyseImage(dataUrl);
  busyVision=false;steadyCount=0;
}
function triggerUpload(){document.getElementById('fileInput').click();}
function onFilePicked(e){const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>analyseImage(rd.result);rd.readAsDataURL(f);}
async function analyseImage(dataUrl){
  document.getElementById('scanStatus').textContent='Identifying item…';
  try{
    const r=await fetch(WORKER+'/vision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({imageBase64:dataUrl})});
    const d=await r.json();
    if(d&&d.query){
      document.getElementById('scanStatus').textContent='Found: '+d.query;
      setLastSearch(d.query);stopScan();go('search');quickView(d.query);
    }else{
      document.getElementById('scanStatus').textContent=(d&&d.reply)?d.reply:'Couldn\'t identify that — try again or use barcode.';
      document.getElementById('viewport').classList.remove('locking');
    }
  }catch(e){document.getElementById('scanStatus').textContent='Scan failed — check connection.';}
}
function scanBarcode(){
  if('BarcodeDetector' in window){document.getElementById('scanStatus').textContent='Point at a barcode…';startBarcodeLoop();}
  else document.getElementById('scanStatus').textContent='Barcode needs a newer browser — use photo.';
}
async function startBarcodeLoop(){
  if(!stream)await startScan();
  const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});
  const cam=document.getElementById('cam');
  const tick=async()=>{if(!stream)return;try{const codes=await det.detect(cam);if(codes&&codes.length){const code=codes[0].rawValue;stopScan();go('search');quickView(code);return;}}catch(_){}requestAnimationFrame(tick);};
  requestAnimationFrame(tick);
}
function trackNew(e){e.preventDefault();const q=document.getElementById('tq').value.trim();if(!q)return false;saveTracked(q);loadTracked();document.getElementById('tq').value='';toast('Tracking "'+q+'"');return false;}
function saveTracked(q){try{const a=JSON.parse(localStorage.getItem('fa_tracked')||'[]');if(!a.includes(q)){a.unshift(q);localStorage.setItem('fa_tracked',JSON.stringify(a.slice(0,30)));}}catch(_){}}
function loadTracked(){
  const list=document.getElementById('tkList');
  let items=[];try{items=JSON.parse(localStorage.getItem('fa_tracked')||'[]');}catch(_){}
  if(!items.length){list.innerHTML='<div class="empty"><b>Nothing tracked yet</b>Search an item above to track its price.</div>';return;}
  list.innerHTML=items.map(q=>'<div class="tk-row" onclick="go(\'search\');quickView(\''+esc(q).replace(/'/g,"&#39;")+'\')"><img src="" alt="" onerror="this.style.visibility=\'hidden\'"><div class="info"><h4>'+esc(q)+'</h4><div class="meta">Tap to see live price</div></div><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a8f98" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></div>').join('');
}
loadFeed();loadTracked();
document.querySelectorAll('#chips .chip').forEach(c=>c.addEventListener('click',()=>{
  document.querySelectorAll('#chips .chip').forEach(x=>x.classList.remove('active'));
  c.classList.add('active');loadFeed();
}));
</script>
