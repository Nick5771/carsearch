name: iOS build
on:
  push:
    paths: ['ios/**', '.github/workflows/ios-build.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build iPhone simulator app without signing
        run: xcodebuild -project ios/WishWave/WishWave.xcodeproj -scheme WishWave -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
