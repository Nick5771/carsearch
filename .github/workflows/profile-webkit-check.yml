name: Profile WebKit checks
on:
  push:
    branches: [main]
    paths:
      - wishwave-inbox.js
      - wishwave-inbox.css
      - tests/inbox-check.cjs
      - wishwave-search-filters.js
      - wishwave-search-filters.css
      - findai-worker.js
      - tests/search-filters-check.cjs
      - tests/search-filters-browser-check.cjs
      - wishwave-search-follow.js
      - tests/reel-scroll-recovery-check.cjs
      - tests/recent-follow-loading-check.cjs
      - wishwave-profile-badges.js
      - wishwave-profile-badges.css
      - tests/profile-badges-browser-check.cjs
      - wishwave-create.js
      - wishwave-create.css
      - tests/create-form-check.cjs
      - tests/create-form-browser-check.cjs
      - wishwave-tab-motion.css
      - tests/tab-layout-browser-check.cjs
      - wishwave-tab-motion.js
      - tests/tab-motion-check.cjs
      - findai-app.html
      - wishwave-coral-theme.css
      - wishwave-home-controls.css
      - wishwave-home-controls.js
      - wishwave-discovery-preferences.js
      - wishwave-discovery-preferences.css
      - tests/discovery-retrieval-check.cjs
      - tests/discovery-preferences-check.cjs
      - tests/discovery-preferences-browser-check.cjs
      - tests/home-controls-browser-check.cjs
      - tests/feed-startup-check.cjs
      - tests/home-trending-check.cjs
      - tests/public-profile-listings-browser-check.cjs
      - tests/profile-grid-option-a-browser-check.cjs
      - .github/workflows/profile-webkit-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/search-reel-feeds-check.cjs
      - run: node tests/search-reel-header-check.cjs
      - run: node tests/search-reel-layout-check.cjs
      - run: node tests/reel-scroll-recovery-check.cjs
      - run: node tests/recent-follow-loading-check.cjs
      - run: node tests/create-form-check.cjs
      - run: node tests/tab-motion-check.cjs
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps webkit
      - run: node tests/search-header-browser-check.cjs
      - run: node tests/tab-layout-browser-check.cjs
      - run: node tests/create-form-browser-check.cjs
      - run: node tests/profile-badges-browser-check.cjs
        if: always()
      - run: node tests/public-profile-listings-browser-check.cjs
        env:
          BROWSER_ENGINE: webkit
      - run: node tests/profile-grid-option-a-browser-check.cjs
        if: always()
        env:
          BROWSER_ENGINE: webkit
      - run: node tests/discovery-retrieval-check.cjs
        if: always()
      - run: node tests/discovery-preferences-check.cjs
        if: always()
      - run: node tests/discovery-preferences-browser-check.cjs
        if: always()
      - run: node tests/search-filters-check.cjs
        if: always()
      - run: node tests/search-filters-browser-check.cjs
        if: always()
      - run: node tests/inbox-check.cjs
        if: always()
      - run: node tests/feed-startup-check.cjs
        if: always()
      - run: node tests/home-trending-check.cjs
        if: always()
      - run: node tests/home-controls-browser-check.cjs
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-webkit-screenshots
          path: |
            /tmp/profile-option-a-*.png
            /tmp/home-controls-*.png
            /tmp/discovery-preferences-*.png
          if-no-files-found: ignore
