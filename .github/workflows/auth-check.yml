ure-scroll-check.cjs', 'tests/starter-buffer-check.cjs', 'tests/starter-inventory-check.cjs', 'tests/shared-starter-client-check.cjs', 'tests/search-home-stability-check.cjs', '.github/workflows/auth-check.yml']
permissions:
  contents: read
jobs:
  account-flows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Worker syntax and account security flows
        run: |
          node --input-type=module --check < findai-worker.js
          node tests/native-push-check.cjs
          node tests/auction-engine-check.cjs
          node tests/auction-api-check.cjs
          node tests/blocked-profile-check.cjs
          node tests/directional-messaging-check.cjs
          node tests/password-auth-check.cjs
          node tests/native-auth-check.cjs
          node tests/starter-inventory-check.cjs
          node tests/listing-photos-check.cjs
          node tests/catalogue-retrieval-check.cjs
          node tests/discovery-inventory-check.cjs
          node tests/product-rotation-check.cjs
          node tests/compare-check.cjs
          node tests/compare-identity-check.cjs
          node tests/startup-recovery-check.cjs
          node tests/treasure-pilot-check.cjs
          node tests/bookmarks-backend-check.cjs
          node tests/native-like-haptic-check.cjs
          node tests/discovery-surfaces-check.cjs
      - name: Install browser DOM test runtime
        run: npm install --prefix "$RUNNER_TEMP/wishwave-auth-runtime" --no-package-lock --no-save jsdom@26.1.0
      - name: Check login, signup and recovery screens
        env:
          NODE_PATH: ${{ runner.temp }}/wishwave-auth-runtime/node_modules
        run: |
          node tests/notification-request-check.cjs
          node tests/live-activity-check.cjs
          node tests/experience-polish-check.cjs
          node tests/native-push-client-check.cjs
          node tests/password-auth-client-check.cjs
          node tests/native-auth-client-check.cjs
          node tests/social-polish-check.cjs
          node tests/session-ui-polish-check.cjs
          node tests/chat-polish-check.cjs
          node tests/connections-check.cjs
          node tests/search-follow-check.cjs
          node tests/bookmarks-client-check.cjs
          node tests/sequential-tab-swipes-check.cjs
          node tests/gallery-tab-return-check.cjs
          node tests/stable-tab-handoff-check.cjs
          node tests/treasure-scroll-check.cjs
          node tests/starter-buffer-check.cjs
          node tests/shared-starter-client-check.cjs
          node tests/interaction-preview-check.cjs
          node tests/compare-client-check.cjs
          node tests/profile-listing-open-check.cjs
          node tests/navigation-origins-check.cjs
          node tests/comments-motion-check.cjs
          node tests/gallery-motion-check.cjs
          node tests/gallery-photo-readiness-check.cjs
          node tests/back-gesture-motion-check.cjs
          WISHWAVE_COMPOSITED_BACK=1 node tests/back-gesture-motion-check.cjs
          node tests/profile-section-motion-check.cjs
          node tests/listing-photos-client-check.cjs
          node tests/public-profile-listings-check.cjs
          node tests/compare-reel-handoff-check.cjs
          node tests/reel-action-contrast-check.cjs
          node tests/search-home-stability-check.cjs
          node tests/account-discovery-polish-check.cjs
          node tests/profile-inbox-polish-check.cjs
          node tests/search-chat-surfaces-check.cjs
          node tests/create-redesign-check.cjs
          node tests/auction-client-check.cjs
          node tests/reel-commerce-check.cjs
          node tests/photo-bounds-check.cjs
          node tests/photo-hygiene-check.cjs
